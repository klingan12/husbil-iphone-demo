name: Publish iPhone Demo
on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - icon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public demo
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          html=pathlib.Path('index.html').read_text()
          data=json.loads(pathlib.Path('manifest.webmanifest').read_text())
          assert "ENDAST DEMO" in html and data["start_url"]=="./"
          assert len(re.findall(r'\bfetch\s*\(',html)) == 1 
          assert 'https://api.open-meteo.com/v1/forecast?' in html 
          assert 'fetch(url,{cache:"no-store"})' in html 
          assert not re.search(r'\b(WebSocket|XMLHttpRequest|EventSource)\s*\(',html)
          assert not re.search(r'/api/|navigator\.bluetooth|navigator\.serial',html,re.I)
          print("Only a safe visual demo is published")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
